<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title description"><title id="title">Investigation pipeline</title><desc id="description">Normalize a failed run, find source leads and produce a deterministic report. Execution and model analysis are optional. Publication remains separate.</desc><style>text{font:15px Arial,sans-serif;fill:#242822}.label{font:10px monospace;letter-spacing:1.4px;fill:#73786e}.card{fill:#fff;stroke:#d5d9cf;stroke-width:1}.dark{fill:#262e26;stroke:#262e26}.inverse{fill:#fff}.edge{fill:none;stroke:#8a9385;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}.lane{fill:#f0f2ec;stroke:none}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a9385" stroke-width="1.3"/></marker></defs><text x="24" y="35" class="label"><tspan x="24" dy="0">01 / READ EVIDENCE</tspan></text><text x="278" y="35" class="label"><tspan x="278" dy="0">02 / INVESTIGATE</tspan></text><text x="530" y="35" class="label"><tspan x="530" dy="0">03 / HAND OFF</tspan></text><path d="M230 106 H278" class="edge" marker-end="url(#arrow)" /><path d="M378 147 V187" class="edge" marker-end="url(#arrow)" /><path d="M478 228 H530" class="edge" marker-end="url(#arrow)" /><path d="M630 269 V309" class="edge" marker-end="url(#arrow)" /><path d="M630 391 V431" class="edge" marker-end="url(#arrow)" /><path d="M230 228 H278" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M378 269 V309" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M478 350 H530" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/><g><rect x="24" y="65" width="206" height="82" rx="7" class="card" /><text x="40" y="100.5" class=""><tspan x="40" dy="0">Failed CI run</tspan><tspan x="40" dy="21">Logs + artifacts</tspan></text></g><g><rect x="278" y="65" width="200" height="82" rx="7" class="dark" /><text x="294" y="100.5" class="inverse"><tspan x="294" dy="0">Normalize failures</tspan><tspan x="294" dy="21">Find source leads</tspan></text></g><g><rect x="278" y="187" width="200" height="82" rx="7" class="card" /><text x="294" y="222.5" class=""><tspan x="294" dy="0">Deterministic report</tspan><tspan x="294" dy="21">Ranked function leads</tspan></text></g><g><rect x="24" y="187" width="206" height="82" rx="7" class="card" stroke-dasharray="5 5"/><text x="40" y="222.5" class=""><tspan x="40" dy="0">Execution + probes</tspan><tspan x="40" dy="21">Optional evidence</tspan></text></g><g><rect x="278" y="309" width="200" height="82" rx="7" class="card" stroke-dasharray="5 5"/><text x="294" y="344.5" class=""><tspan x="294" dy="0">Model analysis</tspan><tspan x="294" dy="21">Optional enrichment</tspan></text></g><g><rect x="530" y="187" width="206" height="82" rx="7" class="card" /><text x="546" y="222.5" class=""><tspan x="546" dy="0">JSON + brief</tspan><tspan x="546" dy="21">Inspectable evidence</tspan></text></g><g><rect x="530" y="309" width="206" height="82" rx="7" class="card" /><text x="546" y="344.5" class=""><tspan x="546" dy="0">Final artifact</tspan><tspan x="546" dy="21">Keep original evidence</tspan></text></g><g><rect x="530" y="431" width="206" height="82" rx="7" class="dark" /><text x="546" y="466.5" class="inverse"><tspan x="546" dy="0">Separate publication</tspan><tspan x="546" dy="21">Update one PR comment</tspan></text></g></svg>