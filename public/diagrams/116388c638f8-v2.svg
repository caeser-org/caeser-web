<svg xmlns="http://www.w3.org/2000/svg" width="760" height="646" viewBox="0 0 760 646" role="img" aria-labelledby="title description"><title id="title">From failed CI to a pull request comment</title><desc id="description">Evidence enters a read-only diagnosis job. Reports optionally pass through model analysis before a separate publication job updates one PR comment.</desc><style>text{font:15px Arial,sans-serif;fill:#242822}.label{font:10px monospace;letter-spacing:1.4px;fill:#73786e}.card{fill:#fff;stroke:#d5d9cf;stroke-width:1}.dark{fill:#262e26;stroke:#262e26}.inverse{fill:#fff}.edge{fill:none;stroke:#8a9385;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}.lane{fill:#f0f2ec;stroke:none}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a9385" stroke-width="1.3"/></marker></defs><rect class="lane" x="258" y="22" width="240" height="598" rx="12"/><text x="24" y="44" class="label"><tspan x="24" dy="0">01 / EVIDENCE</tspan></text><text x="278" y="44" class="label"><tspan x="278" dy="0">02 / INVESTIGATE</tspan></text><text x="530" y="44" class="label"><tspan x="530" dy="0">03 / PUBLISH</tspan></text><path d="M230 113 H250 V205 H278" class="edge" marker-end="url(#arrow)" /><path d="M230 205 H278" class="edge" marker-end="url(#arrow)" /><path d="M230 297 H250 V205 H278" class="edge" marker-end="url(#arrow)" /><path d="M378 246 V286" class="edge" marker-end="url(#arrow)" /><path d="M378 368 V410" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M478 327 H530" class="edge" marker-end="url(#arrow)" /><path d="M478 451 H505 V327 H530" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M630 368 V410" class="edge" marker-end="url(#arrow)" /><path d="M630 492 V532" class="edge" marker-end="url(#arrow)" /><g><rect x="24" y="72" width="206" height="82" rx="7" class="card" /><text x="40" y="107.5" clas