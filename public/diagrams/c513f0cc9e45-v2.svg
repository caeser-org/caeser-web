<svg xmlns="http://www.w3.org/2000/svg" width="760" height="664" viewBox="0 0 760 664" role="img" aria-labelledby="title description"><title id="title">Workspace and execution lifecycle</title><desc id="description">Prepare and validate an isolated workspace, execute locally or in Docker, capture bounded output, preserve evidence, then clean up. Cancellation terminates the selected backend.</desc><style>text{font:15px Arial,sans-serif;fill:#242822}.label{font:10px monospace;letter-spacing:1.4px;fill:#73786e}.card{fill:#fff;stroke:#d5d9cf;stroke-width:1}.dark{fill:#262e26;stroke:#262e26}.inverse{fill:#fff}.edge{fill:none;stroke:#8a9385;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}.lane{fill:#f0f2ec;stroke:none}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a9385" stroke-width="1.3"/></marker></defs><text x="24" y="36" class="label"><tspan x="24" dy="0">01 / PREPARE</tspan></text><text x="278" y="36" class="label"><tspan x="278" dy="0">02 / EXECUTE</tspan></text><text x="530" y="36" class="label"><tspan x="530" dy="0">03 / PRESERVE</tspan></text><path d="M127 147 V187" class="edge" marker-end="url(#arrow)" /><path d="M127 269 V309" class="edge" marker-end="url(#arrow)" /><path d="M230 350 H250 V52 H378 V65" class="edge" marker-end="url(#arrow)" /><path d="M378 147 V187" class="edge" marker-end="url(#arrow)" /><path d="M478 106 H506 V350 H478" class="edge" marker-end="url(#arrow)" /><path d="M478 228 H505 V350 H530" class="edge" marker-end="url(#arrow)" /><path d="M478 350 H530" class="edge" marker-end="url(#arrow)" /><path d="M630 391 V431" class="edge" marker-end="url(#arrow)" /><path d="M630 513 V553" class="edge" marker-end="url(#arrow)" /><path d="M378 391 V431" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M478 472 H505 V350 H530" class="edge" marker-end="url(#arrow)" stroke-dasharray="5 5"/><g><rect x="24" y="65" width="206" height="82" rx="7" class="card" /><text x="40" y="100.5" class=""><tspan x="40" dy="0">Requested experiment</tspan><tspan x="40" dy="21">Exact revision</tspan></text></g><g><rect x="24" y="187" width="206" height="82" rx="7" class="card" /><text x="40" y="222.5" class=""><tspan x="40" dy="0">Disposable workspace</tspan><tspan x="40" dy="21">Recorded checkout</tspan></text></g><g><rect x="24" y="309" width="206" height="82" rx="7" class="dark" /><text x="40" y="344.5" class="inverse"><tspan x="40" dy="0">Validate policy</tspan><tspan x="40" dy="21">Command · env · limits</tspan></text></g><g><rect x="278" y="65" width="200" height="82" rx="7" class="card" /><text x="294" y="100.5" class=""><tspan x="294" dy="0">Choose backend</tspan><tspan x="294" dy="21">Configured executor</tspan></text></g><g><rect x="278" y="187" width="200" height="82" rx="7" class="card" /><text x="294" y="222.5" class=""><tspan x="294" dy="0">Local execution</tspan><tspan x="294" dy="21">Process group</tspan></text></g><g><rect x="278" y="309" width="200" height="82" rx="7" class="card" /><text x="294" y="344.5" class=""><tspan x="294" dy="0">Docker execution</tspan><tspan x="294" dy="21">Disposable container</tspan></text></g><g><rect x="278" y="431" width="200" height="82" rx="7" class="card" stroke-dasharray="5 5"/><text x="294" y="466.5" class=""><tspan x="294" dy="0">On cancellation</tspan><tspan x="294" dy="21">Terminate / remove</tspan></text></g><g><rect x="530" y="309" width="206" height="82" rx="7" class="card" /><text x="546" y="344.5" class=""><tspan x="546" dy="0">Capture output</tspan><tspan x="546" dy="21">Bounded stdout + stderr</tspan></text></g><g><rect x="530" y="431" width="206" height="82" rx="7" class="card" /><text x="546" y="466.5" class=""><tspan x="546" dy="0">Preserve evidence</tspan><tspan x="546" dy="21">Exit · timing · artifacts</tspan></text></g><g><rect x="530" y="553" width="206" height="82" rx="7" class="dark" /><text x="546" y="588.5" class="inverse"><tspan x="546" dy="0">Clean up</tspan><tspan x="546" dy="21">Workspace + resources</tspan></text></g></svg>